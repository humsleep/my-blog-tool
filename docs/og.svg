<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Boheme BlogLab — 블로그 운영의 모든 것을 한 곳에서">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#fb923c"/>
      <stop offset="45%"  stop-color="#f97316"/>
      <stop offset="80%"  stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="glowTR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
    <filter id="textShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#7a1e00" flood-opacity="0.25"/>
    </filter>
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#7a1e00" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1200" cy="0"   r="540" fill="url(#glowTR)"/>
  <circle cx="0"    cy="630" r="480" fill="url(#glowBL)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- 상단: 로고 + 브랜드 -->
  <g transform="translate(88, 72)" filter="url(#boxShadow)">
    <rect width="72" height="72" rx="16" fill="#ffffff"/>
    <text x="36" y="56" text-anchor="middle" font-family="'Wanted Sans Variable','Noto Sans KR',system-ui,sans-serif" font-weight="800" font-size="48" fill="#ea580c">B</text>
  </g>
  <text x="180" y="124" font-family="'Wanted Sans Variable','Noto Sans KR',system-ui,sans-serif" font-weight="500" font-size="36" fill="#ffffff" fill-opacity="0.96" letter-spacing="-0.3">Boheme BlogLab</text>

  <!-- 중앙: 메인 카피 -->
  <g filter="url(#textShadow)">
    <text x="88" y="350" font-family="'Wanted Sans Variable','Noto Sans KR',system-ui,sans-serif" font-weight="800" font-size="96" fill="#ffffff" letter-spacing="-3.5">블로그 운영의</text>
    <text x="88" y="460" font-family="'Wanted Sans Variable','Noto Sans KR',system-ui,sans-serif" font-weight="800" font-size="96" fill="#ffffff" letter-spacing="-3.5">모든 것을 한 곳에서</text>
  </g>

  <!-- 하단: 강조선 + 도메인 -->
  <rect x="88" y="538" width="56" height="4" rx="2" fill="#ffffff" fill-opacity="0.7"/>
  <text x="1112" y="552" text-anchor="end" font-family="'Wanted Sans Variable','Noto Sans KR',system-ui,sans-serif" font-weight="500" font-size="28" fill="#ffffff" fill-opacity="0.94">bohemebloglab.com</text>
</svg>
